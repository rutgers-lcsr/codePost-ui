# Deploy Production with Docker (UI)
#
# Branching model:
#   main              — day-to-day development, auto-deploys to dev server
#   release/<version> — cut from main via "Create Release Branch" workflow
#
# Release flow:
#   1. Run "Create Release Branch" workflow to cut release/<version> from main
#   2. Test on the release branch (CI runs automatically)
#   3. Run THIS workflow and enter release/<version> in the "branch" input
#      (defaults to the ref it was dispatched from)
#   4. Tests run against that branch's head, then it deploys to production,
#      creates a git tag v<version>, and creates a GitHub Release.
#      The version is derived from the branch name (release/3.4.0 -> 3.4.0).
#
# Hotfix flow:
#   1. Fix the bug on main first
#   2. Cherry-pick the fix onto the active release branch (incrementing the
#      patch version in the branch name as needed)
#   3. Re-run THIS workflow with that release branch in the "branch" input
#
# Note: Deploy the API first, then the UI. The API deploy_production workflow
# triggers update-api-client.yml to regenerate the TypeScript client if the
# API schema changed.
#
# Runners: production-ui, testing-codepost

name: Deploy Production with Docker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "release/<version> branch to deploy (defaults to the ref this workflow is dispatched from)"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: testing-codepost
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - name: Validate branch and derive version
        id: meta
        run: |
          branch="${{ inputs.branch }}"
          branch="${branch:-$GITHUB_REF_NAME}"
          if [[ "$branch" != release/* ]]; then
            echo "::error::Production deploys must target a release/<version> branch. Got: ${branch}"
            exit 1
          fi
          if ! git ls-remote --exit-code "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "refs/heads/${branch}" > /dev/null; then
            echo "::error::Branch ${branch} does not exist on origin."
            exit 1
          fi
          version="${branch#release/}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${branch} as v${version}"

  tests:
    needs: [prepare]
    uses: ./.github/workflows/test_codepost_ui.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  deploy:
    needs: [prepare, tests]
    environment: production
    runs-on: production-ui
    env:
      REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Set up Certs
        run: |
          HOSTNAME=$(hostname)
          cp -rflT /etc/letsencrypt/live/$HOSTNAME/ certs/

      - name: Create .env file
        run: |
          cat <<EOF > .env
          REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
          EOF

      - name: Build container
        run: |
          docker compose build

      - name: Deploy container
        run: |
          docker compose up -d --remove-orphans --wait --wait-timeout 180

      - name: Remove docker artifacts
        run: |
          docker system prune -f

      - name: Notify deployment success
        run: echo "Deployment to production UI server successful!"

  tag:
    needs: [prepare, deploy]
    runs-on: testing-codepost
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          git tag "v${{ needs.prepare.outputs.version }}"
          git push origin "v${{ needs.prepare.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --target "${{ needs.prepare.outputs.branch }}" \
            --title "v${{ needs.prepare.outputs.version }}" \
            --generate-notes
